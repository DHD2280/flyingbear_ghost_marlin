name: Build Marlin Ghost 5

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Compile Firmware
      working-directory: "Source code"
      run: pio run -e mks_robin_nano_v1v2

    - name: Firmware + Assets
      run: |
        mkdir -p sd_card_files
        
        cp .pio/build/mks_robin_nano_v1v2/Robin_nano35.bin sd_card_files/
        
        if [ -d "assets" ]; then cp -r assets sd_card_files/; fi
        if [ -d "mks_pic" ]; then cp -r mks_pic sd_card_files/; fi
        if [ -d "mks_font" ]; then cp -r mks_font sd_card_files/; fi

    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: Ghost5-SD-Card-Files
        path: sd_card_files/
        
